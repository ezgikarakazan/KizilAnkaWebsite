<body data-page="iletisim">
<main id="main">

<section class="page-hero">
  <div class="wrap">
    <div class="eyebrow fade-up">İletişim</div>
    <h1>
      <span class="line"><span>Bize</span></span>
      <span class="line"><span><span class="hl">yaz</span></span></span>
    </h1>
    <p class="lead fade-up" style="animation-delay:.5s">Bir sorun, bir fikrin ya da birlikte yapmak istediğin bir şey mi var? Yaz, yanıtlayalım.</p>
  </div>
</section>

<section class="section-white">
  <div class="wrap split">
    <div class="sticky">
      <div class="grid-2" style="grid-template-columns:1fr">
        <a class="mini reveal" href="mailto:info@kizilanka.com"><div class="ic">@</div><h3>E-posta</h3><p>info@kizilanka.com</p></a>
        <a class="mini reveal" data-d="1" href="tel:+905062550002"><div class="ic">☏</div><h3>Telefon</h3><p>+90 506 255 00 02</p></a>
        <div class="mini reveal" data-d="2"><div class="ic">#</div><h3>Sosyal medya</h3>
          <p><a class="accent" style="font-weight:700" href="https://www.instagram.com/kizilankader" target="_blank" rel="noopener">Instagram</a> · <a class="accent" style="font-weight:700" href="https://x.com/kizilankader" target="_blank" rel="noopener">X</a></p></div>
      </div>
    </div>

    <form class="form form-box js-form reveal" data-ok="Mesajın gönderildi. En kısa sürede yanıtlayacağız.">
      <h2 style="font-size:clamp(32px,4vw,48px)">Mesaj <em>gönder</em></h2>
      <fieldset>
        <div class="field"><label for="i-ad">Adı Soyadı</label><input id="i-ad" name="ad_soyad" autocomplete="name" required></div>
        <div class="field"><label for="i-mail">E-posta</label><input id="i-mail" name="eposta" type="email" autocomplete="email" inputmode="email" required></div>
        <div class="field full"><label for="i-konu">Konu</label><input id="i-konu" name="konu" required></div>
        <div class="field full"><label for="i-msg">Mesajın</label><textarea id="i-msg" name="mesaj" required></textarea></div>
      </fieldset>
      <label class="check"><input type="checkbox" name="kvkk_onayi" required><span><a href="kvkk.html">KVKK Aydınlatma Metni</a>’ni okudum. Kişisel verilerimin, 6698 sayılı Kişisel Verilerin Korunması Kanunu’na uygun olarak saklanmasını kabul ediyorum.</span></label>
      <button class="btn btn-red btn-block" type="submit">Mesajı gönder <span class="arrow">↗</span></button>
    </form>
  </div>
</section>
