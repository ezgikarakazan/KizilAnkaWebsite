# Netlify ayarları: site düz HTML, derleme adımı yok; kök klasör yayınlanır.
[build]
  publish = "."

# Form gönderimlerini Fonzip'e aktaran fonksiyon (netlify/functions/submission-created.mjs)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Veri dosyası her açılışta tazelensin (sayılar ve etkinlikler hemen görünsün)
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# İç belgeler ve kaynak dosyaları sitede yayınlanmasın
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
